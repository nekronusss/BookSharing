spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booksharing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:ollama}
  base-url: ${AI_BASE_URL:http://localhost:11434}
  api-key: ${AI_API_KEY:}
  chat-model: ${AI_CHAT_MODEL:qwen2.5:7b}
  embedding-model: ${AI_EMBEDDING_MODEL:bge-m3}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:120}
  daily-call-budget: ${AI_DAILY_CALL_BUDGET:1000}
  requests-per-minute: ${AI_REQUESTS_PER_MINUTE:12}
  similarity-threshold: ${AI_SIMILARITY_THRESHOLD:0.45}
  index-batch-size: ${AI_INDEX_BATCH_SIZE:16}
  index-delay-ms: ${AI_INDEX_DELAY_MS:30000}
