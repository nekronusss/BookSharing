name: Verify BookSharing
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run audit:check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -Dtest=CoreWorkflowTest,PersonalApiSecurityTest,AiServicesTest,AiProviderTest test
  backend-postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: booksharing_ai_test
          POSTGRES_USER: ai_test
          POSTGRES_PASSWORD: ai-test-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_test -d booksharing_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_TEST_DB_URL: jdbc:postgresql://localhost:5432/booksharing_ai_test
      AI_TEST_DB_USERNAME: ai_test
      AI_TEST_DB_PASSWORD: ai-test-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -Dtest=AiPostgresTest test
